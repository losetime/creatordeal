<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreatorDeal - AI-Powered</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0d9488 0%, #10b981 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .poster {
      width: 1080px;
      height: 1080px;
      background: linear-gradient(135deg, #0d9488 0%, #10b981 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px;
      position: relative;
    }
    .ai-icon {
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 60px;
    }
    .ai-icon svg {
      width: 72px;
      height: 72px;
      fill: none;
      stroke: white;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .headline {
      font-size: 72px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      line-height: 1.1;
      margin-bottom: 24px;
    }
    .subline {
      font-size: 32px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.9);
      text-align: center;
      margin-bottom: 80px;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: #0d9488;
      font-size: 20px;
      font-weight: 600;
      padding: 16px 32px;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="poster">
    <div class="ai-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <h1 class="headline">AI Reads Your Contracts</h1>
    <p class="subline">You Focus on Creating</p>
    <a href="#" class="cta">Start Free</a>
  </div>
</body>
</html>
