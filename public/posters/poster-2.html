<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreatorDeal - Contract to Cash</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #18181b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .poster {
      width: 1080px;
      height: 1080px;
      background: #18181b;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px;
      position: relative;
    }
    .headline {
      font-size: 80px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      line-height: 1.1;
      margin-bottom: 24px;
    }
    .subline {
      font-size: 28px;
      font-weight: 400;
      color: #a1a1aa;
      text-align: center;
      margin-bottom: 80px;
    }
    .flow {
      display: flex;
      align-items: center;
      gap: 40px;
      margin-bottom: 80px;
    }
    .flow-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .icon-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #0d9488;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .icon-circle svg {
      width: 40px;
      height: 40px;
      fill: none;
      stroke: white;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .flow-label {
      font-size: 16px;
      font-weight: 500;
      color: #ffffff;
    }
    .arrow {
      font-size: 32px;
      color: #0d9488;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #0d9488;
      color: #ffffff;
      font-size: 20px;
      font-weight: 600;
      padding: 16px 32px;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="poster">
    <h1 class="headline">Contract to Cash</h1>
    <p class="subline">Upload. AI Extracts. Get Paid.</p>
    
    <div class="flow">
      <div class="flow-item">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
        </div>
        <span class="flow-label">Upload</span>
      </div>
      
      <span class="arrow">→</span>
      
      <div class="flow-item">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24">
            <path d="M12 2a8 8 0 0 0-8 8c0 3.4 2.2 6.3 5.2 7.4V22l4-2.2 4 2.2v-4.6C17.8 16.3 20 13.4 20 10a8 8 0 0 0-8-8z"/>
          </svg>
        </div>
        <span class="flow-label">AI Extracts</span>
      </div>
      
      <span class="arrow">→</span>
      
      <div class="flow-item">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24">
            <line x1="12" y1="1" x2="12" y2="23"/>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        <span class="flow-label">Get Paid</span>
      </div>
    </div>
    
    <a href="#" class="cta">Try CreatorDeal</a>
  </div>
</body>
</html>
