<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreatorDeal - Focus on Creating</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .poster {
      width: 1080px;
      height: 1080px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px;
      position: relative;
    }
    .rocket {
      width: 80px;
      height: 80px;
      background: #0d9488;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 60px;
    }
    .rocket svg {
      width: 48px;
      height: 48px;
      fill: none;
      stroke: white;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .headline {
      font-size: 72px;
      font-weight: 700;
      color: #000000;
      text-align: center;
      line-height: 1.1;
      margin-bottom: 24px;
    }
    .subline {
      font-size: 36px;
      font-weight: 500;
      color: #0d9488;
      text-align: center;
      margin-bottom: 80px;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #000000;
      color: #ffffff;
      font-size: 20px;
      font-weight: 600;
      padding: 16px 32px;
      border-radius: 8px;
      text-decoration: none;
    }
    .cta:hover {
      background: #333333;
    }
  </style>
</head>
<body>
  <div class="poster">
    <div class="rocket">
      <svg viewBox="0 0 24 24">
        <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
        <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
        <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
        <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
      </svg>
    </div>
    <h1 class="headline">Focus on Creating</h1>
    <p class="subline">We Handle the Rest</p>
    <a href="#" class="cta">Start Free →</a>
  </div>
</body>
</html>
